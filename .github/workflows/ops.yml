name: operations
# Central control: approvals, production, calendar, analytics, health checks, alerts, control centre.
on:
  schedule:
    - cron: "20 * * * *"
  issues:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      job:
        description: "run only this job (empty = all due jobs)"
        default: ""
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: operations
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy tzdata faster-whisper piper-tts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: mkdir -p cloud/fonts && curl -sL -o cloud/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
      - name: French voice
        continue-on-error: true
        run: |
          python -m piper.download_voices fr_FR-siwis-medium --data-dir "$RUNNER_TEMP/voices"
          echo "PIPER_VOICE=fr_FR-siwis-medium" >> "$GITHUB_ENV"
          echo "PIPER_DIR=$RUNNER_TEMP/voices" >> "$GITHUB_ENV"
          echo "PIPER_CREDIT=Piper, voix fr_FR-siwis (corpus SIWIS, CC BY 4.0)" >> "$GITHUB_ENV"
      - name: Orchestrate
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          JOB: ${{ github.event.inputs.job }}
        run: python cloud/ops.py run ${JOB:+--job "$JOB"}
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python cloud/save.py "ops: state, calendar and control centre" db queue music/usage_log.json ops/control_center.html ops/reports
