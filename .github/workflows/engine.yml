name: content-engine
# DISCOVER -> ANALYSE -> SCORE -> SELECT -> PRODUCE -> PACKAGE -> REVIEW (GitHub issue). Publishing is post.yml.
on:
  schedule:
    - cron: "5 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      videos:
        description: "videos to produce this run"
        default: "0"
permissions:
  contents: write
  issues: write
concurrency:
  group: content-engine
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy tzdata faster-whisper
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: mkdir -p cloud/fonts && curl -sL -o cloud/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
      - name: Run the engine
        run: python cloud/engine.py --max-analyse 40 --videos ${{ github.event.inputs.videos || '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python cloud/intelligence.py dashboard
      - name: Save the database and queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python cloud/save.py "engine: database and queue update" db queue/manifest.json music/usage_log.json ops/evaluation_dashboard.html
