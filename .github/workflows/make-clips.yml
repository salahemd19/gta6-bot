name: make-clips
on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: make-clips
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yt-dlp faster-whisper numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji
      - run: python cloud/make_clips.py
        env:
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
      - name: Save the queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "queue: new cloud clips"
          git pull --rebase -X theirs
          git push
