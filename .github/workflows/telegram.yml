name: telegram-approvals
# Sends new videos to the owner's Telegram chat and applies Publier / Rejeter. Does nothing until the bot is connected.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: telegram
jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - name: Send requests and apply answers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python cloud/telegram_bot.py run --listen 60
      - name: Save decisions
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python cloud/save.py "telegram: decisions" queue db config/overrides.json
