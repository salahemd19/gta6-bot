name: post-next

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (UTC) so posts land close to their hot slot
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: post-next
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post the next due videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CLOUD_PLATFORMS: ${{ vars.CLOUD_PLATFORMS }}
        run: python bot/post_next.py
      - name: Save the updated queue
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          python cloud/save.py "queue: update post status" queue/manifest.json db
