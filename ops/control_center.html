const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link=(u,t)=>/^https:\/\//.test(u||"")?`<a href="${E(u)}" target="_blank" rel="noopener">${E(t)}</a>`:E(t);
const paris=t=>t?new Date(t).toLocaleString("fr-FR",{timeZone:"Europe/Paris",dateStyle:"short",timeStyle:"short"}):"";
const table=(head,rows,empty)=>rows.length?`<div class="wide"><table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`:`<p class="mut">${empty}</p>`;
const card=(t,b)=>`<section class="card"><h2>${t}</h2>${b}</section>`;
const issue=n=>n?link(`https://github.com/${D.repo}/issues/${n}`,"issue "+n):"";
const cls=h=>h==="ok"?"ok":h==="failed"?"bad":"warn";
const views={
 Overview:()=>card("Alerts",D.override.paused?`<p class="bad">All automation is paused. ${E(D.override.note)}</p>`:D.alerts.length?`<ul>${D.alerts.map(a=>`<li class="bad">${E(a)}</li>`).join("")}</ul>`:'<p class="ok">No alert.</p>')
  +card("Daily production targets",D.targets.map(t=>`<p>${E(t.platform)}<br><span class="big">${t.done}</span> <span class="mut">of ${t.cap} today (target ${t.target})</span></p><div class="bar"><i style="width:${Math.min(100,100*t.done/t.cap)}%"></i></div>`).join(""))
  +card("Workflows",table(["Workflow","Health","Last run"],Object.values(D.workflows).map(w=>[link(w.url,w.name),`<span class="${cls(w.health)}">${E(w.health)}</span>`,w.age_h==null?"":w.age_h+" h ago"]),"Not checked yet."))
  +card("Jobs",table(["Job","Last result"],Object.entries(D.jobs).map(([n,j])=>[E(n),`<span class="${j.failures?"bad":""}">${E(j.error||j.result)}</span>`]),"No job has run.")),
 Content:()=>card(`New discoveries: ${D.discoveries.count_24h} in 24 h (${D.discoveries.total} total)`,table(["Creator","Clip","Views"],D.discoveries.top.map(r=>[E(r.creator),link(r.url,r.title||"clip"),E(r.views)]),"Nothing new."))
  +card("Approved candidates (production queue)",table(["Creator","What happens","State"],D.candidates.map(c=>[E(c.creator),E(c.what),c.blockers.length?`<span class="warn">${E(c.blockers.join("; "))}</span>`:'<span class="ok">ready</span>']),"No reviewed clip."))
  +card("Best unreviewed (score is not reliable: watch first)",table(["Creator","Score","Clip"],D.unreviewed.map(r=>[E(r.creator),E(r.score),link(r.url,r.id)]),"None."))
  +card("Rights status",table(["Rights","Clips"],D.rights.map(r=>[E(r[0]),r[1]]),"Empty."))
  +card("Authenticity",table(["Authenticity","Clips"],D.authenticity.map(r=>[E(r[0]),r[1]]),"Empty.")),
 Publishing:()=>card("Awaiting your approval",table(["Video","Platform","Decide"],D.review.map(r=>[E(r.title),E(r.platform),issue(r.issue)]),"Nothing is waiting."))
  +card("Ready to publish",table(["Video","Platform","Slot (Paris)"],D.ready.map(r=>[E(r.title),E(r.platform),E(paris(r.slot))]),"Nothing approved and unpublished."))
  +Object.entries(D.calendar).map(([p,days])=>card("Calendar: "+E(p),days.map(d=>`<p class="mut">${E(d.date)} (up to ${d.cap})</p>`+table(["Time","Window","Video"],d.slots.map(s=>[E(s.local),E(s.window),s.id?E(s.title||s.id)+` <span class="mut">${E(s.status)}</span>`:'<span class="mut">empty</span>']),"No slot left.")).join(""))).join("")
  +card("Scheduled posts",table(["Video","Platform","Status"],D.planned.map(r=>[E(r.title),E(r.platform),E(r.status)]),"None."))
  +card("Published posts",table(["Video","Platform","Status"],D.published.map(r=>[E(r.title),E(r.platform),E(r.status)]),"None."))
  +card("Held back",table(["Video","Platform","Why"],D.blocked.map(r=>[E(r.id),E(r.platform),E(r.why)]),"Nothing held back.")),
 Analytics:()=>{const A=D.analytics;if(!A.platforms)return card("Analytics",'<p class="mut">No report yet.</p>');
  return Object.entries(A.platforms).map(([p,c])=>card(E(p),`<p><span class="big">${E(c.median_latest_views??"-")}</span> <span class="mut">median views per video, ${c.videos} videos, ${c.measured_24h} with a 24 h reading</span></p><p class="mut">Median like rate ${E(c.median_like_rate_pct??"-")}%. Top video holds ${c.top_share_of_views==null?"-":Math.round(100*c.top_share_of_views)+"%"} of views. Not collected: ${E(c.not_collected.join(", ")||"nothing")}</p>`
    +Object.entries(c.dimensions).filter(([,g])=>g.length).map(([d,g])=>table([E(d),"n","Median 24 h"],g.map(x=>[E(x.group)+(x.enough?"":' <span class="mut">(too few)</span>'),x.n,x.median_24h]),"")).join(""))).join("")
  +card("Recommendations",`<ul>${A.advice.map(a=>`<li>${E(a.platform)}: ${E(a.text)}</li>`).join("")}</ul><p class="mut">${E(A.scoring)}</p>`)
  +card("Experiments",table(["Question","State"],A.experiments.map(e=>[E(e.question),E(e.status)]),"None."))
  +card("Recent videos",table(["Video","Platform","Views"],A.recent.map(r=>[E(r.title),E(r.platform),E(r.views)]),"None."))},

  +card("Latest activity",table(["When","Job","Result"],D.log.slice().reverse().map(l=>[E(paris(l.at)),E(l.job),E(l.result+" "+l.detail)]),"Empty."))

const tabs=document.getElementById("tabs");
function show(n){if(!views[n])n="Overview";document.getElementById("view").innerHTML=views[n]();[...tabs.children].forEach(b=>b.setAttribute("aria-selected",b.textContent===n))}
Object.keys(views).forEach(n=>{const b=document.createElement("button");b.textContent=n;b.setAttribute("role","tab");b.onclick=()=>{show(n);history.replaceState(null,"","#"+n)};tabs.appendChild(b)});

show(location.hash.slice(1));
